name: 每日天气推送 (和风天气 · 16天周期)

on:
  schedule:
    # 北京时间 07:40 = UTC 23:40（前一天）
    - cron: '40 23 * * *'
  workflow_dispatch:
    inputs:
      test_day:
        description: '测试用：周期第几天（1-16），留空按真实日期计算'
        required: false
        default: ''

jobs:
  push-weather:
    runs-on: ubuntu-latest
    steps:
      - name: 获取天气并推送到微信
        env:
          START_DATE: "2026-11-17"
          
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
          QWEATHER_LOCATION: "101181402"   # 扶沟县 Location ID
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
          WECHAT_OPENID: ${{ secrets.WECHAT_OPENID }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
          TEST_DAY: ${{ github.event.inputs.test_day }}
        run: |
          # 【文本编辑区】
          # TEXTS[0]~[7] 对应第1~8天；TEXTS[8] 对应第9~16天。
          # 注意：文本中不要出现英文双引号 " 和反引号 `。
          TEXTS=(
            "第1天附加文本，请替换。"
            "第2天附加文本，请替换。"
            "第3天附加文本，请替换。"
            "第4天附加文本，请替换。"
            "第5天附加文本，请替换。"
            "第6天附加文本，请替换。"
            "第7天附加文本，请替换。"
            "第8天附加文本，请替换。"
            "第9到16天统一使用的文本，请替换。"
          )
          # 【文本编辑区结束】

          TODAY=$(TZ='Asia/Shanghai' date +%F)

          if [ -n "$TEST_DAY" ]; then
            DAY_IN_CYCLE="$TEST_DAY"
            echo "手动测试：周期第 ${DAY_IN_CYCLE} 天"
          else
            DIFF_DAYS=$(( ( $(date -d "$TODAY" +%s) - $(date -d "$START_DATE" +%s) ) / 86400 ))
            if [ "$DIFF_DAYS" -lt 0 ]; then
              echo "今天(${TODAY})早于起始日(${START_DATE})，不推送。"
              exit 0
            fi
            DAY_IN_CYCLE=$(( DIFF_DAYS % 16 + 1 ))
            echo "今天 ${TODAY}，周期第 ${DAY_IN_CYCLE} 天"
          fi

          if [ "$DAY_IN_CYCLE" -le 8 ]; then
            EXTRA="${TEXTS[$((DAY_IN_CYCLE - 1))]}"
          else
            EXTRA="${TEXTS[8]}"
          fi

          # 1. 请求和风天气
          QWEATHER_RAW=$(curl -s --compressed "https://${QWEATHER_API_HOST}/v7/weather/3d?location=${QWEATHER_LOCATION}&key=${QWEATHER_API_KEY}")

          # 2. 使用单行 Python 解析 JSON，绝对避免缩进报错
          WEATHER=$(echo "$QWEATHER_RAW" | python3 -c "import sys,json; d=json.load(sys.stdin); print('获取天气失败，和风返回码：'+str(d.get('code'))) if d.get('code')!='200' else print('今天：{}，{}~{}°C，{}km/h风，湿度{}%\n明天：{}，{}~{}°C，{}km/h风，湿度{}%'.format(d['daily'][0]['textDay'], d['daily'][0]['tempMin'], d['daily'][0]['tempMax'], d['daily'][0]['windSpeedDay'], d['daily'][0]['humidity'], d['daily'][1]['textDay'], d['daily'][1]['tempMin'], d['daily'][1]['tempMax'], d['daily'][1]['windSpeedDay'], d['daily'][1]['humidity']))")

          # 3. 拼接正文
          MSG=$(printf "%s\n\n%s" "${WEATHER}" "${EXTRA}")
          TITLE="天气提醒 | ${TODAY} | 第${DAY_IN_CYCLE}天"

                    # 4. 获取 access_token 并发送微信模板消息
          TOKEN_JSON=$(curl -s "https://api.weixin.qq.com/cgi-bin/token?grant_type=client_credential&appid=${WECHAT_APPID}&secret=${WECHAT_SECRET}")
          ACCESS_TOKEN=$(echo "$TOKEN_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "获取 access_token 失败，返回：${TOKEN_JSON}"
            exit 1
          fi

          # 用 Python 构造合法的 JSON（自动处理中文和换行转义）
          JSON_BODY=$(python3 -c "
          import sys, json
          print(json.dumps({
          'touser': sys.argv[1],
          'template_id': sys.argv[2],
          'data': {
            'weather': {'value': sys.argv[3]},
            'extra':   {'value': sys.argv[4]}
                   }
                            }, ensure_ascii=False))
          " "${WECHAT_OPENID}" "${WECHAT_TEMPLATE_ID}" "${WEATHER}" "${EXTRA}")

          SEND_RESULT=$(curl -sS -X POST "https://api.weixin.qq.com/cgi-bin/message/template/send?access_token=${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$JSON_BODY")

          echo "发送结果：${SEND_RESULT}"
         
