name: 每日天气推送 (和风天气 · 16天周期)

on:
  schedule:
    # 北京时间 07:40 = UTC 23:40（前一天）
    - cron: '40 23 * * *'
  workflow_dispatch:
    inputs:
      test_day:
        description: '测试用：周期第几天（1-16），留空按真实日期计算'
        required: false
        default: ''

jobs:
  push-weather:
    runs-on: ubuntu-latest
    steps:
      - name: 获取天气并推送到微信
        env:
          START_DATE: "2026-11-17"
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
          QWEATHER_LOCATION: "69003692"   # ← 换成扶沟县的 Location ID
          TEST_DAY: ${{ github.event.inputs.test_day }}
        run: |
          # ============================================================
          # 【文本编辑区】共 9 段：
          # TEXTS[0] ~ TEXTS[7] 对应周期第 1~8 天
          # TEXTS[8] 对应周期第 9~16 天
          # 只替换引号里的中文，保持 9 个元素、顺序不变。
          # 不要出现英文双引号 " 和反引号 `。
          # ============================================================
          TEXTS=(
            "第1天附加文本，请替换。"
            "第2天附加文本，请替换。"
            "第3天附加文本，请替换。"
            "第4天附加文本，请替换。"
            "第5天附加文本，请替换。"
            "第6天附加文本，请替换。"
            "第7天附加文本，请替换。"
            "第8天附加文本，请替换。"
            "第9到16天统一使用的文本，请替换。"
          )
          # ============================================================
          # 【文本编辑区结束】
          # ============================================================

          TODAY=$(TZ='Asia/Shanghai' date +%F)

          if [ -n "$TEST_DAY" ]; then
            DAY_IN_CYCLE="$TEST_DAY"
            echo "手动测试：周期第 ${DAY_IN_CYCLE} 天"
          else
            DIFF_DAYS=$(( ( $(date -d "$TODAY" +%s) - $(date -d "$START_DATE" +%s) ) / 86400 ))
            if [ "$DIFF_DAYS" -lt 0 ]; then
              echo "今天(${TODAY})早于起始日(${START_DATE})，不推送。"
              exit 0
            fi
            DAY_IN_CYCLE=$(( DIFF_DAYS % 16 + 1 ))
            echo "今天 ${TODAY}，周期第 ${DAY_IN_CYCLE} 天"
          fi

          if [ "$DAY_IN_CYCLE" -le 8 ]; then
            EXTRA="${TEXTS[$((DAY_IN_CYCLE - 1))]}"
          else
            EXTRA="${TEXTS[8]}"
          fi

          # 调用和风天气 3 天预报，取今明两天
          WEATHER=$(curl -s --compressed \
            "https://${QWEATHER_API_HOST}/v7/weather/3d?location=${QWEATHER_LOCATION}&key=${QWEATHER_API_KEY}" \
            | python3 -c '
import sys, json
d = json.load(sys.stdin)
if d.get("code") != "200":
    print("获取天气失败，和风返回码：" + str(d.get("code")))
else:
    daily = d["daily"]
    out = []
    for i, label in enumerate(["今天", "明天"]):
        day = daily[i]
        out.append("{}：{}，{}~{}°C，{}km/h风，湿度{}%".format(
            label,
            day["textDay"],
            day["tempMin"],
            day["tempMax"],
            day["windSpeedDay"],
            day["humidity"]
        ))
    print("\n".join(out))
')

          MSG="${WEATHER}"$'\n\n'"${EXTRA}"
          TITLE="天气提醒 | ${TODAY} | 第${DAY_IN_CYCLE}天"

          curl -sS -X POST "https://sctapi.ftqq.com/${SERVERCHAN_SENDKEY}.send" \
            --data-urlencode "title=${TITLE}" \
            --data-urlencode "desp=${MSG}"
